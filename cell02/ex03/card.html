<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <h2>User Profile Card</h2>
        
        <!-- ใช้ตารางล่องหนในการจัดโครงสร้างข้อมูล -->
        <table class="profile-table">
            <tr>
                <td>
                    <img class="profile-pic" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Profile Picture">
                </td>
            </tr>
            <tr>
                <td class="login-name">pesriton</td>
            </tr>
            <tr>
                <td class="description">42 Student Developer</td>
            </tr>
            <tr>
                <td>
                    <div class="social-icons">
                        <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
